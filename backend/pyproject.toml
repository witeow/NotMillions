[project]
name = "notmillions-backend"
version = "0.1.0"
description = "NotMillions — self-hosted SME accounting (sales-side MVP)"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
